spring:
  application:
    name: erp-notas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_notas}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    # shortcut: o Hibernate cria/atualiza as tabelas sozinho; trocar por Flyway + "validate" quando o schema estabilizar
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Em produção, defina JWT_SECRET (mínimo 32 caracteres). O valor padrão serve apenas para estudo local.
    secret: ${JWT_SECRET:troque-este-segredo-de-estudo-com-32-chars-ou-mais}
    expiracao-minutos: 120
  nfse:
    ambiente: SIMULACAO
    # Alíquotas (%) do IBS/CBS usadas só pelo simulador para calcular a NFS-e. Na Sefin elas vêm da Calculadora
    # da Receita: confira os valores vigentes antes de usar os XMLs em outro sistema.
    simulacao:
      aliquota-cbs: 0.90
      aliquota-ibs-uf: 0.10
      aliquota-ibs-mun: 0.00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
